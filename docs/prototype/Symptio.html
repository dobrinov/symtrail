<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symtrail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #E9EBF2; font-family: 'Sora', 'Roboto', system-ui, sans-serif; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes symFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes symFadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes symSheetIn { from { transform: translateY(101%); } to { transform: translateY(0); } }
    @keyframes symSheetOut { from { transform: translateY(0); } to { transform: translateY(101%); } }
    .sym-temp-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; outline: none; cursor: pointer; }
    .sym-temp-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid currentColor; box-shadow: 0 2px 6px rgba(12,9,23,0.28); cursor: pointer; }
    .sym-temp-slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid currentColor; box-shadow: 0 2px 6px rgba(12,9,23,0.28); cursor: pointer; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens-shared.jsx"></script>
  <script type="text/babel" src="screens-home.jsx"></script>
  <script type="text/babel" src="screens-calendar.jsx"></script>
  <script type="text/babel" src="screens-log.jsx"></script>
  <script type="text/babel" src="screens-meds.jsx"></script>
  <script type="text/babel" src="screens-flare.jsx"></script>
  <script type="text/babel" src="screens-profile.jsx"></script>
  <script type="text/babel" src="screens-report.jsx"></script>
  <script type="text/babel" src="screens-auth.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
