name: Deploy marketing website

# Publishes website/ to GitHub Pages.
#
# BLOCKED as of 2026-07-26: every run is rejected before Checkout —
# "Branch main is not allowed to deploy to github-pages due to environment
# protection rules." The repo's github-pages environment currently only
# allows gh-pages/marketing-website to deploy to it (left over from legacy
# branch-deploy mode). Fix once, by hand: Settings → Environments →
# github-pages → Deployment branches and tags → add "main" (or "No
# restriction"). See CLAUDE.md's Deployment section for the live/intended
# split until that's done.

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # enablement: true turns Pages on (build_type=workflow) if it isn't
      # already, so the repo needs no manual Settings → Pages step.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
